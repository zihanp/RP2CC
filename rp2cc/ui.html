<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RP2CC · 数学内核工作台</title>
<style>
  :root { color-scheme: light; color: #171717; background: #f5f5f4; font: 16px/1.55 system-ui, "Microsoft YaHei", sans-serif; }
  * { box-sizing: border-box; }
  body { max-width: 1310px; margin: auto; padding: 32px clamp(16px, 4vw, 52px) 40px; }
  header { border-top: 4px solid #181818; border-bottom: 1px solid #bbb; padding: 16px 0 22px; }
  h1 { font-size: clamp(1.65rem, 4vw, 2.65rem); letter-spacing: -.04em; margin: 0 0 6px; }
  h2 { font-size: 1.08rem; margin: 0 0 12px; }
  p { margin: 0; color: #4b4b4b; }
  main { margin-top: 22px; display: grid; grid-template-columns: minmax(0, .84fr) minmax(0, 1.16fr); gap: 24px; }
  section { min-width: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  button, select { font: inherit; background: #fff; color: inherit; border: 1px solid #555; padding: 6px 10px; }
  button { cursor: pointer; }
  button[aria-pressed="true"], .run { background: #1c1c1c; color: #fff; }
  button:disabled { opacity: .55; cursor: wait; }
  button:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid #707070; outline-offset: 2px; }
  textarea, pre { border: 1px solid #bdbdbb; background: #fff; display: block; font: .88rem/1.6 ui-monospace, Consolas, monospace;
                padding: 13px; margin: 0; width: 100%; min-height: 340px; resize: vertical; tab-size: 4; }
  pre { max-height: 64vh; overflow: auto; }
  #status { min-height: 2.2em; padding-top: 8px; }
  #summary { margin-top: 12px; overflow-wrap: anywhere; }
  footer { border-top: 1px solid #bbb; margin-top: 24px; padding-top: 12px; font-size: .94rem; }
  @media (max-width: 780px) { main { grid-template-columns: 1fr; } textarea, pre { min-height: 255px; } }
</style>
</head>
<body>
<header>
  <h1>RP2CC 数学内核工作台</h1>
  <p>编辑一段整数程序，对比编译前后的 C，并查看这次改写的证书。</p>
</header>
<main>
  <section aria-labelledby="input-title">
    <h2 id="input-title">输入：.rpm 数学源码</h2>
    <div class="controls">
      <label for="example">示例</label><select id="example"></select>
      <button type="button" class="run" id="run">编译并对比</button>
    </div>
    <textarea id="source" aria-label=".rpm 数学源码" spellcheck="false" wrap="off"></textarea>
    <p id="status" aria-live="polite">正在读取示例……</p>
  </section>
  <section aria-labelledby="output-title">
    <h2 id="output-title">输出：生成代码和优化证据</h2>
    <div class="controls" id="views" role="group" aria-label="输出类型">
      <button type="button" data-view="optimized" aria-pressed="true">优化 C</button>
      <button type="button" data-view="baseline" aria-pressed="false">基线 C</button>
      <button type="button" data-view="ir" aria-pressed="false">中间表示</button>
      <button type="button" data-view="certificate" aria-pressed="false">优化证书</button>
    </div>
    <pre id="output" tabindex="0" aria-label="编译输出">在左侧点击“编译并对比”。</pre>
    <p id="summary"></p>
  </section>
</main>
<footer><p>这里实际运行 Python 编译器和内置检查器，不执行用户输入，不调用 Lean，也不连接开发板。独立证明和实板复核见项目 README。关闭终端里的服务即可结束。</p></footer>
<script>
const byId = id => document.getElementById(id);
const run = byId('run'), example = byId('example'), source = byId('source');
const status = byId('status'), out = byId('output'), summary = byId('summary');
const buttons = Array.from(document.querySelectorAll('[data-view]'));
const rules = {'affine.jump': '递推合并', 'swar.floor2.bias': '双道取整'};
let presets = {}, result = null, view = 'optimized';

function show() {
  for (const button of buttons) button.setAttribute('aria-pressed', String(button.dataset.view === view));
  if (result) out.textContent = typeof result[view] === 'string' ? result[view] : JSON.stringify(result[view], null, 2);
  out.scrollTop = 0;
}
function clear() {
  result = null;
  out.textContent = '在左侧点击“编译并对比”。';
  summary.textContent = '';
}
function chooseExample() {
  source.value = presets[example.value].source;
  clear();
  status.textContent = '可编辑后再编译。';
}
async function compile() {
  run.disabled = source.readOnly = example.disabled = true;
  clear();
  status.textContent = '编译中……';
  try {
    const response = await fetch('/api/compile', {method: 'POST',
      headers: {'Content-Type': 'text/plain; charset=utf-8'}, body: source.value});
    const data = await response.json();
    if (!response.ok) throw new Error(data.error);
    result = data;
    const counts = Object.entries(result.stats.rules).map(([name, n]) => (rules[name] || name) + ' ' + n + ' 次');
    summary.textContent = counts.length ? '命中的改写：' + counts.join('；') : '这次没有命中改写，已保留原算法。';
    status.textContent = '完成：' + result.stats.kernels + ' 个内核已通过 Python 检查。';
    show();
  } catch (error) {
    status.textContent = error.message || '编译失败，检查服务是否仍在运行。';
  } finally {
    run.disabled = source.readOnly = example.disabled = false;
  }
}
for (const button of buttons) button.addEventListener('click', () => { view = button.dataset.view; show(); });
example.addEventListener('change', chooseExample);
source.addEventListener('input', () => { clear(); status.textContent = '源码已修改，请重新编译。'; });
run.addEventListener('click', compile);
run.disabled = example.disabled = true;
fetch('/api/examples').then(response => response.json()).then(data => {
  presets = data;
  for (const [key, item] of Object.entries(data)) example.add(new Option(item.title, key));
  chooseExample();
  run.disabled = example.disabled = false;
}).catch(() => { status.textContent = '无法载入示例，请用本地工作台打开此页。'; });
</script>
</body>
</html>
